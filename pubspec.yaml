name: flutter_application_1
description: TapTalk — offline AAC communication app for learners.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.5
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  flutter_tts: ^4.2.2
  speech_to_text: ^7.0.0
  image_picker: ^1.1.2
  crypto: ^3.0.6
  uuid: ^4.5.1
  intl: ^0.20.2
  firebase_core: ^4.9.0
  firebase_app_check: ^0.4.1
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_storage: ^13.0.5
  connectivity_plus: ^6.1.4
  telephony: ^0.2.0
  permission_handler: ^11.4.0
  url_launcher: ^6.3.1
  flutter_svg: ^2.3.0
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0
  video_player: ^2.10.0
  video_player_win: ^3.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Use OS SQLite instead of downloading binaries from GitHub during build.
hooks:
  user_defines:
    sqlite3:
      source: system
      name_windows: winsqlite3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/categories/
    - assets/images/
    - assets/images/Activities/
    - assets/images/Animals/
    - assets/images/Colors/
    - assets/images/Drinks/
    - assets/images/Family/
    - assets/images/Feelings/
    - assets/images/Foods/
    - assets/images/Greetings/
    - "assets/images/Health & Safety/"
    - assets/images/Hobbies/
    - assets/images/Needs/
    - assets/images/Places/
    - assets/images/Responses/
    - assets/images/School/
    - assets/images/Technology/
    - assets/images/Transportation/
    - "assets/images/Category Cards/"
    - "assets/images/Logo/"
    - assets/videos/Activities/
    - assets/videos/Alphabet/
    - "assets/videos/Body Parts/"
    - "assets/videos/Days & Months/"
    - assets/videos/Emotions/
    - assets/videos/Family/
    - assets/videos/Greetings/
    - assets/videos/Home/
    - assets/videos/Numbers/
    - assets/videos/Phrases/
    - assets/videos/Questions/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
